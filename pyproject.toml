[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-scout"
version = "2.0.0"
description = "Agentic, evidence-grounded e-commerce support automation"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aakash Makwana" }]
dependencies = [
    "smolagents>=1.14",
    "openai>=1.40",
    "pydantic>=2.7",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "tavily-python>=0.5",
    "fastapi>=0.110",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[project.scripts]
support-scout = "support_scout.main:main"

[tool.setuptools]
package-dir = {"support_scout" = "src/support_scout", "evaluation" = "src/evaluation", "data_server" = "data_server"}
packages = [
    "support_scout",
    "support_scout.agents",
    "support_scout.clients",
    "support_scout.services",
    "support_scout.tools",
    "support_scout.workflow",
    "evaluation",
    "data_server",
]

[tool.setuptools.package-data]
support_scout = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "live: requires real API keys and network access (excluded by default)",
]

[tool.coverage.run]
source = ["src/support_scout"]
branch = true
